base:
  - systemd-sysv
  - linux-image-generic
  - grub-efi-amd64-signed
  - shim-signed
  - plymouth
  - plymouth-themes
  - ca-certificates
  # Node 24 from NodeSource node_24.x (the nodejs package provides npm;
  # Debian trixie nodejs is v20 — the API crashes on Node <22 via
  # node:sqlite, so the distro nodejs/npm packages are not used).
  - nodejs
profiles:
  headless: []
  developer:
    - fonts-jetbrains-mono
  desktop: []
  recovery: []
external-runtime:
  # Installed as global npm packages on the image; discovered at runtime by
  # packages/external-runtime (codex / claude / gemini executables).
  - '@openai/codex'
  - '@anthropic-ai/claude-code'
  - '@google/gemini-cli'
