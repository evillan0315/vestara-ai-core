[package]
name = "vestara-workspace-ui-v2-desktop"
version = "2.0.0"
description = "Vestara Workspace UI v2 — standalone desktop shell (Tauri host)"
authors = ["Vestara"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "vestara_workspace_ui_v2_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
