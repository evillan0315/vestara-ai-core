name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: bash build-order.sh

      - run: pnpm test

      - name: Benchmark comparison
        run: |
          echo "Running pipeline benchmarks..."
          pnpm benchmark 2>&1 | tail -10
          echo ""
          echo "Running indexing benchmarks..."
          pnpm benchmark-index 2>&1 | tail -10
